# HTTP bootstrap. Enable HTTPS after DNS points to this EC2 address.
# Do not open Node port 3002 or MCP ports in the EC2 security group.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nasaspaceappschallenge.marulee.dev _;
    server_tokens off;
    client_max_body_size 8000000;

    # Compress large catalogues and UI assets; preserve exact decoded bytes.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        # Observations and evidence must never be served from proxy caches.
        proxy_cache off;
    }
}
